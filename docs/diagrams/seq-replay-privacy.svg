<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 616" role="img" aria-labelledby="earnfarm-seq-title earnfarm-seq-desc" font-family="'Geist','Helvetica Neue',Arial,'PingFang SC','Microsoft YaHei',sans-serif">
  <title id="earnfarm-seq-title">操作复盘：API 密钥全程不出访客浏览器</title>
  <desc id="earnfarm-seq-desc">时序图：浏览器本地解密密钥并直连币安签名取成交，只把数据发给服务端汇总，AI 生成报告后返回浏览器；密钥从未到达服务器。</desc>
  <defs>
    <marker id="s-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#71717a"/>
    </marker>
    <marker id="s-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
    <marker id="s-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ==== 生命线 ==== -->
  <line x1="144" y1="112" x2="144" y2="540" stroke="rgba(24,24,27,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="112" x2="400" y2="540" stroke="rgba(24,24,27,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="656" y1="112" x2="656" y2="540" stroke="rgba(24,24,27,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="868" y1="112" x2="868" y2="540" stroke="rgba(24,24,27,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ==== 激活条 ==== -->
  <rect x="140" y="152" width="8" height="356" fill="rgba(24,24,27,0.06)" stroke="#71717a" stroke-width="0.8"/>
  <rect x="396" y="216" width="8" height="48" fill="rgba(24,24,27,0.06)" stroke="#71717a" stroke-width="0.8"/>
  <rect x="652" y="312" width="8" height="196" fill="rgba(24,24,27,0.06)" stroke="#71717a" stroke-width="0.8"/>
  <rect x="864" y="400" width="8" height="48" fill="rgba(24,24,27,0.06)" stroke="#71717a" stroke-width="0.8"/>

  <!-- ==== 消息（自上而下） ==== -->
  <!-- m1 自消息：本地解密 -->
  <path d="M 148,160 H 188 V 184 H 156" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#s-arrow)"/>
  <rect x="196" y="164" width="120" height="16" rx="2" fill="#ffffff"/>
  <text x="200" y="176" fill="#71717a" font-size="8" font-family="'Geist Mono',ui-monospace,Consolas,monospace" letter-spacing="0.06em">web crypto 解密</text>

  <!-- m2 浏览器 → 币安：签名请求 -->
  <line x1="148" y1="224" x2="392" y2="224" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#s-arrow-link)"/>
  <rect x="224" y="204" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="272" y="213" fill="#2e5aa8" font-size="8" font-family="'Geist Mono',ui-monospace,Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">hmac 签名请求</text>

  <!-- m3 币安 ⇢ 浏览器：返回成交 -->
  <line x1="396" y1="264" x2="152" y2="264" stroke="#71717a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#s-arrow)"/>
  <rect x="240" y="244" width="64" height="12" rx="2" fill="#ffffff"/>
  <text x="272" y="253" fill="#71717a" font-size="8" font-family="'Geist Mono',ui-monospace,Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">成交明细</text>

  <!-- m4 浏览器 → 服务端：只发数据 -->
  <line x1="148" y1="312" x2="648" y2="312" stroke="#71717a" stroke-width="1.2" marker-end="url(#s-arrow)"/>
  <rect x="460" y="292" width="128" height="12" rx="2" fill="#ffffff"/>
  <text x="524" y="301" fill="#71717a" font-size="8" font-family="'Geist Mono',ui-monospace,Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">成交数据 · 不含密钥</text>

  <!-- m5 自消息：Decimal 汇总 -->
  <path d="M 660,344 H 700 V 368 H 668" fill="none" stroke="#71717a" stroke-width="1.2" marker-end="url(#s-arrow)"/>
  <rect x="708" y="348" width="112" height="16" rx="2" fill="#ffffff"/>
  <text x="712" y="360" fill="#71717a" font-size="8" font-family="'Geist Mono',ui-monospace,Consolas,monospace" letter-spacing="0.06em">decimal 汇总</text>

  <!-- m6 服务端 → AI -->
  <line x1="660" y1="408" x2="860" y2="408" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#s-arrow-link)"/>
  <rect x="716" y="388" width="88" height="12" rx="2" fill="#ffffff"/>
  <text x="760" y="397" fill="#2e5aa8" font-size="8" font-family="'Geist Mono',ui-monospace,Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">汇总 + 指令</text>

  <!-- m7 AI ⇢ 服务端：报告 -->
  <line x1="864" y1="448" x2="664" y2="448" stroke="#71717a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#s-arrow)"/>
  <rect x="712" y="428" width="96" height="12" rx="2" fill="#ffffff"/>
  <text x="760" y="437" fill="#71717a" font-size="8" font-family="'Geist Mono',ui-monospace,Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">markdown 报告</text>

  <!-- m8 服务端 → 浏览器：复盘报告（头条成功，珊瑚） -->
  <line x1="652" y1="496" x2="152" y2="496" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#s-arrow-accent)"/>
  <rect x="216" y="476" width="112" height="12" rx="2" fill="#ffffff"/>
  <text x="272" y="485" fill="#eb6c36" font-size="8" font-family="'Geist Mono',ui-monospace,Consolas,monospace" text-anchor="middle" letter-spacing="0.06em">复盘报告 ✓</text>

  <!-- ==== 角色框（最后画，压住生命线顶端） ==== -->
  <rect x="72" y="64" width="144" height="48" rx="6" fill="#ffffff"/>
  <rect x="72" y="64" width="144" height="48" rx="6" fill="rgba(113,113,122,0.10)" stroke="#a1a1aa" stroke-width="1"/>
  <text x="144" y="85" fill="#18181b" font-size="12" font-weight="600" text-anchor="middle">访客浏览器</text>
  <text x="144" y="101" fill="#71717a" font-size="9" font-family="'Geist Mono',ui-monospace,Consolas,monospace" text-anchor="middle">密钥只在这里</text>

  <rect x="328" y="64" width="144" height="48" rx="6" fill="#ffffff"/>
  <rect x="328" y="64" width="144" height="48" rx="6" fill="rgba(24,24,27,0.03)" stroke="rgba(24,24,27,0.30)" stroke-width="1"/>
  <text x="400" y="85" fill="#18181b" font-size="12" font-weight="600" text-anchor="middle">币安 API</text>
  <text x="400" y="101" fill="#71717a" font-size="9" font-family="'Geist Mono',ui-monospace,Consolas,monospace" text-anchor="middle">fapi · userTrades</text>

  <rect x="584" y="64" width="144" height="48" rx="6" fill="#ffffff"/>
  <rect x="584" y="64" width="144" height="48" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1"/>
  <text x="656" y="85" fill="#18181b" font-size="12" font-weight="600" text-anchor="middle">earnfarm 服务端</text>
  <text x="656" y="101" fill="#71717a" font-size="9" font-family="'Geist Mono',ui-monospace,Consolas,monospace" text-anchor="middle">只见数据</text>

  <rect x="796" y="64" width="144" height="48" rx="6" fill="#ffffff"/>
  <rect x="796" y="64" width="144" height="48" rx="6" fill="rgba(24,24,27,0.03)" stroke="rgba(24,24,27,0.30)" stroke-width="1"/>
  <text x="868" y="85" fill="#18181b" font-size="12" font-weight="600" text-anchor="middle">AI 引擎</text>
  <text x="868" y="101" fill="#71717a" font-size="9" font-family="'Geist Mono',ui-monospace,Consolas,monospace" text-anchor="middle">访客自带 key</text>

  <!-- ==== 旁注（衬线斜体） ==== -->
  <line x1="144" y1="540" x2="144" y2="552" stroke="rgba(24,24,27,0.20)" stroke-width="0.8"/>
  <text x="144" y="568" fill="#52525b" font-size="14" font-style="italic" font-family="'Instrument Serif',Georgia,'Songti SC',serif" text-anchor="middle">API Secret 从未离开这条生命线</text>

  <!-- ==== 图例 ==== -->
  <line x1="32" y1="584" x2="928" y2="584" stroke="rgba(24,24,27,0.10)" stroke-width="0.8"/>
  <text x="32" y="604" fill="#71717a" font-size="8" font-family="'Geist Mono',ui-monospace,Consolas,monospace" letter-spacing="0.14em">图例</text>
  <line x1="112" y1="600" x2="140" y2="600" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#s-arrow-link)"/>
  <text x="148" y="604" fill="#71717a" font-size="8" font-family="'Geist Mono',ui-monospace,Consolas,monospace">调用</text>
  <line x1="216" y1="600" x2="244" y2="600" stroke="#71717a" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#s-arrow)"/>
  <text x="252" y="604" fill="#71717a" font-size="8" font-family="'Geist Mono',ui-monospace,Consolas,monospace">返回</text>
  <line x1="320" y1="600" x2="348" y2="600" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#s-arrow-accent)"/>
  <text x="356" y="604" fill="#71717a" font-size="8" font-family="'Geist Mono',ui-monospace,Consolas,monospace">头条结果</text>
</svg>
