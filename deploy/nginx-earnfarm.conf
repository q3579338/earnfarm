# 如果服务器上已有 nginx 在服务其他站点（如 faucet），不要再装 Caddy——
# 把这个 server 块放进 /etc/nginx/sites-enabled/ 然后 `nginx -s reload`。
# 橙云（Cloudflare 代理）模式：边缘做 HTTPS，源站听 80 即可。
server {
    listen 80;
    server_name earn.satloot.com;

    location / {
        proxy_pass http://127.0.0.1:8777;
        proxy_http_version 1.1;
        # NiceGUI 靠 WebSocket 活着，这三行缺了页面会一直"Connection lost"
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
